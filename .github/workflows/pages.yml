# Развёртывание веб-демо (pkg2-demo-web) на GitHub Pages: тесты → сборка → публикация папки dist.
name: Демо на GitHub Pages

on:
  push:
    branches: [main, claude/photorealistic-project-qfsnz2]
    paths: ['pkg2-demo-web/**', 'data/examples/**', 'pkg1-sim-vm/godot/textures/markers/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg2-demo-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pkg2-demo-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pkg2-demo-web/dist

  # публикация — только из main (ветки PR проверяются сборкой и тестами); нужен Settings → Pages → Source: GitHub Actions
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
