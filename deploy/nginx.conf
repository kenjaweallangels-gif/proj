# Защита входа от перебора (зона объявляется на уровне http — conf.d подключается внутри него)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;                                   # для прод замените на plm.corp.local
    ssl_certificate     /etc/nginx/certs/plm.crt;    # корпоративный CA или ./make-certs.sh
    ssl_certificate_key /etc/nginx/certs/plm.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 40m;                        # загрузка Excel

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                     # долгие ответы ИИ / импорт
    }
}
