server {
    listen 80;
    server_name plm.corp.local;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name plm.corp.local;
    ssl_certificate     /etc/nginx/certs/plm.crt;   # внутренний корпоративный CA
    ssl_certificate_key /etc/nginx/certs/plm.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 40m;                       # загрузка Excel

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # ограничение частоты для входа (защита от перебора)
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    location = /api/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://app:8000; include /etc/nginx/proxy_params; }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;                    # долгие ответы ИИ / импорт
    }
}
