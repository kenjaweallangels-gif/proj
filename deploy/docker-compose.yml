# Развёртывание в корпоративной сети: PostgreSQL + приложение + локальная LLM (Ollama) + nginx (TLS).
# Запуск: cp .env.example .env && docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plm
      POSTGRES_USER: plm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plm"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PLM_DATABASE_URL: postgresql+psycopg2://plm:${POSTGRES_PASSWORD}@db:5432/plm
      PLM_SECRET_KEY: ${PLM_SECRET_KEY:?set in .env}
      PLM_SEED_DEMO: ${PLM_SEED_DEMO:-false}
      PLM_CORS_ORIGINS: ${PLM_CORS_ORIGINS:-https://plm.corp.local}
      PLM_LOCAL_LLM_ENABLED: ${PLM_LOCAL_LLM_ENABLED:-true}
      PLM_LOCAL_LLM_URL: http://ollama:11434/v1
      PLM_LOCAL_LLM_MODEL: ${PLM_LOCAL_LLM_MODEL:-qwen2.5:14b-instruct}
      PLM_CLOUD_LLM_ENABLED: ${PLM_CLOUD_LLM_ENABLED:-false}
      PLM_ANTHROPIC_API_KEY: ${PLM_ANTHROPIC_API_KEY:-}
      PLM_CLOUD_LLM_MODEL: ${PLM_CLOUD_LLM_MODEL:-claude-opus-5-5}
      # секреты коннекторов (имена задаются в конфиге коннектора через *_env)
      ONEC_PASSWORD: ${ONEC_PASSWORD:-}
      ERP_DB_URL: ${ERP_DB_URL:-}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    expose: ["11434"]
    # Для GPU раскомментируйте:
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: [db]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -h db -U plm plm | gzip > /backups/plm-$$(date +%F-%H%M).sql.gz; find /backups -mtime +30 -delete; sleep 86400; done"]

volumes:
  pgdata:
  ollama:
