<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR-сборка · демо</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%2210%22 width=%2224%22 height=%2212%22 rx=%226%22 fill=%22%2358e6ff%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
  <header class="top">
    <div class="brand"><b>AR-сборка</b><span id="opTitle">загрузка…</span><small id="opMeta"></small></div>
    <div class="seg" role="group" aria-label="Вид">
      <button data-view="eye">Глазами</button><button data-view="side">Со стороны</button><button data-view="split">Оба</button>
    </div>
    <a class="sim-link" href="./galley.html" title="Фотореалистичный симулятор: приход на участок, AR-очки, сборка кухонного модуля КМ-2">Симулятор участка КМ-2 ▸</a>
    <select id="opSel" aria-label="Операция">
      <option value="040">040 · полка на верстаке</option>
      <option value="070">070 · полка в фюзеляже</option>
    </select>
  </header>

  <main id="stage">
    <canvas id="view"></canvas>
    <div id="fpCtl" class="ctl"><div id="hud" class="hud"></div><span class="tag">Глазами сборщика · очки 52°</span></div>
    <div id="tpCtl" class="ctl"><span class="tag">Со стороны · голубой конус — окно дисплея, белый — поле зрения глаза</span></div>
    <div id="notes" hidden></div>
  </main>

  <footer class="bar">
    <div class="steps">
      <button id="btnPrev" title="Назад (B, ←)">Назад</button>
      <button id="btnNext" class="primary" title="Дальше (N, пробел, →)">Дальше</button>
      <button id="btnAuto" title="Автопоказ">Авто</button>
      <button id="btnSpeed" title="Скорость анимации">1×</button>
      <button id="btnPhoto" title="Фото (P)">Фото</button>
      <span id="valBox" hidden><input id="val" inputmode="decimal" placeholder="значение" aria-label="Значение"><button id="valOk">OK</button></span>
    </div>
    <div id="stepTitle" class="title"></div>
    <div class="tools">
      <button id="btnVoice" title="Голос: «сборка дальше», «сборка покажи кд», «сборка три и две»">Голос</button>
      <span id="heard"></span>
      <button id="btnFull" title="Окно 52° / полное поле (F)">Окно 52°</button>
      <button id="btnPanel" title="Панель (Tab)">Панель</button>
      <form id="chatForm"><input id="chatIn" placeholder="Сообщение мастеру…" aria-label="Сообщение"></form>
    </div>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
