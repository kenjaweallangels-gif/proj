services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: arasm
      POSTGRES_USER: arasm
      POSTGRES_PASSWORD: change_me_local
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  server:
    build:
      context: ..
      dockerfile: pkg1-sim-vm/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://arasm:change_me_local@db:5432/arasm
      AR_DATA_DIR: /data
    ports: ["8080:8080"]
    volumes: ["./server_data:/data", "../data:/data/examples:ro"]
    depends_on: [db]
volumes:
  pgdata: {}
