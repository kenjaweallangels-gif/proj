f you'd tripped on your own thought.",condition:"",emotion:"Calm",duration:6.8,next:""},DLG_A1_005:{id:"DLG_A1_005",speaker:"Rayn",RU:"\u0412 \u041A\u0438\u043D\u0435 \u043C\u043D\u0435 \u0433\u043E\u0432\u043E\u0440\u0438\u043B\u0438, \u0447\u0442\u043E \u043F\u0443\u0441\u0442\u044B\u043D\u044F \u043F\u0443\u0441\u0442\u0430. \u0412 \u041A\u0438\u043D\u0435 \u043C\u043D\u043E\u0433\u043E \u0447\u0435\u0433\u043E \u0433\u043E\u0432\u043E\u0440\u044F\u0442.",EN:"In Keen they told me the desert was empty. They say a lot of things in Keen.",condition:"ZoneEnter:A1_Ridge",emotion:"Wry",duration:6.5,next:"DLG_A1_006"},DLG_A1_006:{id:"DLG_A1_006",speaker:"Kair",RU:"\u041F\u0443\u0441\u0442\u044B\u043D\u044F \u043F\u043E\u043B\u043D\u0430. \u041F\u0440\u043E\u0441\u0442\u043E \u0432\u0441\u0451 \u0432 \u043D\u0435\u0439 \u2014 \u043F\u043E\u0434 \u0442\u043E\u0431\u043E\u0439.",EN:"The desert is full. It's just that all of it is under your feet.",condition:"",emotion:"Calm",duration:5.5,next:""},DLG_TUT_001:{id:"DLG_TUT_001",speaker:"Kair",RU:"\u0421\u043B\u0438\u0448\u043A\u043E\u043C \u0440\u043E\u0432\u043D\u043E. \u0422\u044B \u0441\u0442\u0443\u0447\u0438\u0448\u044C, \u043A\u0430\u043A \u0442\u0430\u043C\u043F\u0435\u0440.",EN:"Too even. You're knocking like a thumper.",condition:"SandWalk:Regular",emotion:"Tense",duration:3.2,next:""},DLG_TUT_002:{id:"DLG_TUT_002",speaker:"Kair",RU:"\u041D\u0435 \u0431\u0435\u0433\u0438. \u0411\u0435\u0433 \u043D\u0430 \u043F\u0435\u0441\u043A\u0435 \u2014 \u044D\u0442\u043E \u043A\u0440\u0438\u043A.",EN:"Don't run. Running on sand is a shout.",condition:"NoiseAbove:0.7",emotion:"Tense",duration:3.5,next:""},DLG_TUT_003:{id:"DLG_TUT_003",speaker:"Kair",RU:"\u0412\u043E\u0442. \u0422\u0430\u043A \u0445\u043E\u0434\u044F\u0442 \u0442\u0435, \u043A\u043E\u0433\u043E \u043F\u0443\u0441\u0442\u044B\u043D\u044F \u043D\u0435 \u0437\u0430\u043C\u0435\u0447\u0430\u0435\u0442.",EN:"There. That's how the ones the desert ignores walk.",condition:"SandWalk:Irregular",emotion:"Calm",duration:3.9,next:""},DLG_TUT_004:{id:"DLG_TUT_004",speaker:"Kair",RU:"\u041D\u0430 \u043A\u0430\u043C\u043D\u0435 \u043C\u043E\u0436\u043D\u043E \u0434\u044B\u0448\u0430\u0442\u044C. \u041A\u0430\u043C\u0435\u043D\u044C \u043C\u043E\u043B\u0447\u0438\u0442.",EN:"On rock you can breathe. Rock keeps quiet.",condition:"Surface:Rock",emotion:"Calm",duration:3.5,next:""},DLG_TUT_005:{id:"DLG_TUT_005",speaker:"Ilva",RU:"\u0420\u0438\u0442\u043C \u0432\u044B\u0434\u0430\u0451\u0442 \u0432\u0430\u0441 \u0440\u0430\u043D\u044C\u0448\u0435, \u0447\u0435\u043C \u0433\u043E\u043B\u043E\u0441.",EN:"Your rhythm gives you away before your voice does.",condition:"SandWalk:Regular",emotion:"Calm",duration:3.9,next:""},DLG_TUT_006:{id:"DLG_TUT_006",speaker:"Kair",RU:"\u041F\u043B\u043E\u0442\u043D\u044B\u0439 \u043F\u0435\u0441\u043E\u043A \u0433\u0443\u0434\u0438\u0442, \u043A\u0430\u043A \u0431\u0430\u0440\u0430\u0431\u0430\u043D. \u041E\u0431\u0445\u043E\u0434\u0438 \u0441\u0432\u0435\u0442\u043B\u044B\u0435 \u043F\u044F\u0442\u043D\u0430.",EN:"Packed sand booms like a drum. Go around the pale patches.",condition:"Surface:PackedSand",emotion:"Tense",duration:4.5,next:""},DLG_A2_001:{id:"DLG_A2_001",speaker:"Rayn",RU:"\u0421\u043A\u043E\u043B\u044C\u043A\u043E \u0435\u0449\u0451?",EN:"How much farther?",condition:"",emotion:"Neutral",duration:1.9,next:"DLG_A2_002"},DLG_A2_002:{id:"DLG_A2_002",speaker:"Kair",RU:"\u0421\u0442\u043E\u043B\u044C\u043A\u043E, \u0441\u043A\u043E\u043B\u044C\u043A\u043E \u043F\u0435\u0441\u043E\u043A \u043F\u043E\u0437\u0432\u043E\u043B\u0438\u0442.",EN:"As far as the sand allows.",condition:"",emotion:"Calm",duration:2.9,next:""},DLG_A2_B01:{id:"DLG_A2_B01",speaker:"Rayn",RU:"\u0413\u043E\u0432\u043E\u0440\u044F\u0442, \u0447\u0435\u0440\u0432\u0438 \u0447\u0443\u044E\u0442 \u0432\u043E\u0434\u0443 \u0432 \u0447\u0435\u043B\u043E\u0432\u0435\u043A\u0435. \u042D\u0442\u043E \u043F\u0440\u0430\u0432\u0434\u0430, \u04
